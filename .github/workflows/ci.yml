name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, test, e2e, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (all workspaces)
        run: npm test --workspaces --if-present

      # A fresh clone has no data/learning-hub.db; the E2E suite clones it per test
      # file, so create the schema (and the idempotent seed data the quote/CLI/MCP
      # tests read) first. Both are idempotent and never touch a real user's DB.
      - name: Create database schema + seed
        run: |
          npm run db:push
          npm run db:seed

      - name: E2E tests
        run: npx vitest run --config vitest.e2e.config.mjs

      - name: Build
        run: npm run build

      # The bundle the Windows/Android apps ship (static export + hub worker).
      # Fast, and catches anything that only breaks the native build.
      - name: Build native web bundle
        run: npm run web:tauri
