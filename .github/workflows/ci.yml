name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, test, e2e, build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Unit tests (all workspaces)
        run: npm test --workspaces --if-present

      # A fresh clone has no data/learning-hub.db; the E2E suite clones it per test
      # file, so create the schema (and the idempotent seed data the quote/CLI/MCP
      # tests read) first. Both are idempotent and never touch a real user's DB.
      - name: Create database schema + seed
        run: |
          npm run db:push
          npm run db:seed

      - name: E2E tests
        run: npx vitest run --config vitest.e2e.config.mjs

      - name: Get Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright UI smoke tests
        run: npm run test:ui
        env:
          UI_SMOKE_PORT: 3100

      - name: Upload actual-route screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: apps/web/visual-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Cache Next.js build cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/web/.next-tauri/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build

      # Synthetic, isolated, no network egress: the built server must register the pinned
      # fetch from src/instrumentation.ts and must refuse outbound fetches when it is missing.
      - name: Pinned fetch server smoke
        if: github.event_name != 'pull_request'
        # Run inside a fresh network namespace that has only loopback, so nothing can leave the
        # runner even if the test harness is wrong. The script refuses to run otherwise.
        run: |
          sudo unshare -n sh -c "ip link set lo up && exec sudo -u $USER env PATH=$PATH SMOKE_REQUIRE_NO_EGRESS=1 node apps/web/tests/smoke/pinned-server-smoke.mjs"

      # The bundle the Windows/Android apps ship (static export + hub worker).
      # Fast, and catches anything that only breaks the native build.
      - name: Build native web bundle
        if: github.event_name != 'pull_request'
        run: npm run web:tauri
