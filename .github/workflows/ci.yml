name: CI

# paths-ignore lists only files no check reads: prettier (format:check) covers every other
# *.md and the vitest suites read docs/curriculum, so ignoring docs broadly would silently skip
# real checks. Because a path-ignored run is not created at all, make the `CI gate` job the
# required status check, and never add a path here that a job below consumes.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.claude/**'
      - 'docs/handoffs/**'
      - '.zcode/**'
      - 'math-333/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'LICENSE'
      - '.claude/**'
      - 'docs/handoffs/**'
      - '.zcode/**'
      - 'math-333/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node (via @huggingface/transformers) has a postinstall that
  # downloads the CUDA provider libs from the NuGet feed on linux/x64. That
  # download times out from current runners and the app only ever uses the
  # bundled CPU runtime, so skip it everywhere we npm ci.
  ONNXRUNTIME_NODE_INSTALL: skip
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Job map (every step of the old single `test` job lives in exactly one job below):
  #   static : typecheck, lint, prettier, commitlint (PR only)
  #   unit   : npm test --workspaces --if-present
  #   e2e    : db:push + db:seed, vitest e2e config
  #   ui     : Playwright smoke suite on `next dev`, 3 shards, ports 3100/3101/3102
  #   prod   : next build, production-build UI pass, pinned fetch smoke, native web bundle (push only)
  #   gate   : fails unless every job above succeeded (skipped is a failure, except prod on PRs)
  # Artifacts: arena-shots-N, visual-screenshots-N, ui-screenshots-N, playwright-report-N
  # (failure only) per ui shard; visual-screenshots-prod from prod.
  static:
    name: Typecheck, lint, format, commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  unit:
    name: Unit tests (all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Unit tests (all workspaces)
        run: npm test --workspaces --if-present

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # A fresh clone has no data/learning-hub.db; the E2E suite clones it per test
      # file, so create the schema (and the idempotent seed data the quote/CLI/MCP
      # tests read) first. Both are idempotent and never touch a real user's DB.
      - name: Create database schema + seed
        run: |
          npm run db:push
          npm run db:seed

      - name: E2E tests
        run: npx vitest run --config vitest.e2e.config.mjs

  ui:
    name: Playwright UI smoke (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # One server per shard on its own port; specs read UI_SMOKE_PORT directly.
      UI_SMOKE_PORT: ${{ 3099 + matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Create database schema + seed
        run: |
          npm run db:push
          npm run db:seed

      - name: Get Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            apps/web/.next/cache
            apps/web/.next-tauri/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Playwright UI smoke tests
        run: npm run test:ui -- --shard=${{ matrix.shard }}/3

      - name: Upload arena screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arena-shots-${{ matrix.shard }}
          path: apps/web/test-results/shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload actual-route screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-screenshots-${{ matrix.shard }}
          path: apps/web/visual-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ matrix.shard }}
          path: apps/web/ui-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  prod:
    name: Build, production UI pass, pinned fetch smoke, native bundle
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Create database schema + seed
        run: |
          npm run db:push
          npm run db:seed

      - name: Get Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            apps/web/.next/cache
            apps/web/.next-tauri/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build

      # Production render pass: serve the bundle built above with `next start` and rerun the
      # actual-route visual spec (same strict zero-error assertions) into a separate artifact.
      - name: Production-build UI pass
        run: npx playwright test visual-redesign.spec.ts
        working-directory: apps/web
        env:
          UI_SMOKE_PORT: 3101
          LH_PROD: '1'
          VISUAL_OUT: visual-out-prod

      - name: Upload production-build screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-screenshots-prod
          path: apps/web/visual-out-prod/
          if-no-files-found: ignore
          retention-days: 14

      # Synthetic, isolated, no network egress: the built server must register the pinned
      # fetch from src/instrumentation.ts and must refuse outbound fetches when it is missing.
      - name: Pinned fetch server smoke
        # Run inside a fresh network namespace that has only loopback, so nothing can leave the
        # runner even if the test harness is wrong. The script refuses to run otherwise.
        run: |
          PARENT_NS=$(readlink /proc/self/ns/net)
          echo "runner netns: $PARENT_NS"
          sudo unshare -n sh -c "ip link set lo up && exec sudo -u $USER env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy PATH=$PATH SMOKE_PARENT_NETNS=$PARENT_NS SMOKE_REQUIRE_NO_EGRESS=1 NEXT_TELEMETRY_DISABLED=1 node apps/web/tests/smoke/pinned-server-smoke.mjs"

      # The bundle the Windows/Android apps ship (static export + hub worker).
      - name: Build native web bundle
        run: npm run web:tauri

  # Single required check. Keeps the old protected name's meaning: it is green only when
  # every job really succeeded. A skipped or cancelled job is a failure, never a green pass.
  gate:
    name: CI gate
    if: always()
    needs: [static, unit, e2e, ui, prod]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r --arg ev "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "prod" or $ev != "pull_request" or .value.result != "skipped")
            | .key')
          if [ -n "$bad" ]; then echo "Not successful: $bad"; exit 1; fi
