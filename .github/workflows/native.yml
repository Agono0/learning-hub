name: Native apps

# Builds the Windows installer and the Android APKs from the single apps/web
# codebase on every push to main (and on version tags / manual runs), so each
# change is proven to ship on both platforms. Tests live in ci.yml.
#
# A single `web-export` job builds the Tauri web bundle once on Linux, and passes
# the static export to the downstream Windows and Android jobs via artifact.
# This avoids building the web layer 4 separate times, eliminates Next.js cache
# contention, and prevents 3 GB Next.js cache uploads from evicting Rust and
# Gradle toolchain caches.
#
# Android ships one APK per ABI (arm64-v8a, armeabi-v7a, x86_64) instead of a
# single universal build, so users download only the native code their device
# needs. Each ABI builds in its own parallel matrix job (fail-fast disabled,
# so one failing ABI does not cancel the others).

on:
  push:
    branches: [main]
    paths:
      - 'apps/native/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/tauri-*.mjs'
      - 'scripts/serve-static.mjs'
      - 'scripts/vendor-sqlite-wasm.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor: sideload (self-update on) or play (self-update off)'
        required: false
        default: sideload
        type: choice
        options:
          - sideload
          - play

# Least privilege: read-only by default. Only the Android job publishes the
# canonical per-ABI APKs to the stable `latest` release (a fixed sideload
# download URL and the base the APK-delta step diffs against) and so gets
# contents:write at job level. Windows stays artifact-only.
permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-export:
    name: Web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build web bundle for Tauri
        run: npm run web:tauri

      - name: Upload web export artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-web-export
          path: apps/web/.next-tauri
          include-hidden-files: true
          if-no-files-found: error

  windows:
    name: Windows (NSIS)
    needs: [web-export]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/native/src-tauri

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download web export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tauri-web-export
          path: apps/web/.next-tauri

      # The Rust unit tests (update.rs slots/verify/rollback, lock_win.rs) are
      # never compiled by a plain `cargo build` — run them explicitly so the
      # OTA + Max Focus acceptances are actually executed in CI.
      - name: Rust unit tests
        run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml --release

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LH_SKIP_WEB_BUILD: '1'
        run: npm run app:build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learning-hub-windows
          path: |
            apps/native/src-tauri/target/release/bundle/nsis/*.exe
            apps/native/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  android:
    name: Android (${{ matrix.abi }})
    needs: [web-export]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One ABI failing must not cancel the other ABI builds.
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
            tauri-target: aarch64
          - abi: armeabi-v7a
            rust-target: armv7-linux-androideabi
            tauri-target: armv7
          - abi: x86_64
            rust-target: x86_64-linux-android
            tauri-target: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # O1-22: never silently auto-generate a fresh keystore in CI — a new
      # signing key makes every previously installed sideload APK refuse the
      # update (signature mismatch). The base64 keystore MUST be provided as a
      # repo secret; keytool fallback is dev-only.
      - name: Require persisted Android keystore (O1-22)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Sideload updates require a stable signing key — see docs/updates.md §'Android signing — keystore persistence (O1-22)'."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # Gradle cannot run on very new JDKs; 21 is the supported LTS.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            apps/native/src-tauri/gen/android/**/*.gradle*
            apps/native/src-tauri/gen/android/**/gradle-wrapper.properties

      # Each job compiles Rust only for its own ABI, in parallel.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/native/src-tauri
          key: android-${{ matrix.abi }}

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download web export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tauri-web-export
          path: apps/web/.next-tauri

      - name: Build APK (${{ matrix.abi }})
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          # O1-12/O1-30: play-flavor builds bake self-update off (Play policy
          # forbids self-downloading APK updates); sideload builds keep it on.
          LH_UPDATE_CHANNEL_FLAVOR: ${{ inputs.flavor || 'sideload' }}
          # Strong keystore password (KEYSTORE-PASSWORD.txt in the keys backup).
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # The keystore decode runs in tauri-android.mjs at BUILD time — the
          # guard step's env does not reach here (O1-22).
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # The KEY's own password (PKCS12: same value as the store password).
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Lets the post-build step publish the canonical APK to the `latest`
          # release (stable sideload URL + APK-delta base).
          GH_TOKEN: ${{ github.token }}
          LH_SKIP_WEB_BUILD: '1'
        run: npm run android:build -- --target ${{ matrix.tauri-target }}

      # O1-21: generate a bsdiff delta APK against the previous release's APK
      # for the same ABI (when one exists). The client keeps the full-APK
      # fallback until measured ratios justify the on-device patch path.
      - name: Generate APK delta (${{ matrix.abi }})
        continue-on-error: true
        run: |
          sudo apt-get install -y bsdiff
          mkdir -p dist/delta prev
          gh release download latest --repo "$GITHUB_REPOSITORY" --pattern '*${{ matrix.abi }}*.apk' --dir prev --clobber || echo "no previous release APK — skipping delta"
          PREV_APK=$(ls prev/*${{ matrix.abi }}*.apk 2>/dev/null | head -1 || true)
          NEW_APK=$(ls apps/native/src-tauri/gen/android/app/build/outputs/apk/**/*${{ matrix.abi }}*.apk 2>/dev/null | head -1 || true)
          if [ -n "$PREV_APK" ] && [ -n "$NEW_APK" ]; then
            bsdiff "$PREV_APK" "$NEW_APK" "dist/delta/Learning-HUB-${{ matrix.abi}}.delta.patch"
            sha256sum "dist/delta/"*.patch >> dist/delta/delta-report.json || true
            echo "delta size: $(wc -c < dist/delta/*.patch) bytes (full: $(wc -c < "$NEW_APK") bytes)"
          else
            echo "delta skipped: missing base or target APK"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Only this job's ABI APK is uploaded, so each artifact is a single
      # per-ABI download instead of one universal bundle.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learning-hub-android-${{ matrix.abi }}
          path: apps/native/src-tauri/gen/android/app/build/outputs/apk/**/*${{ matrix.abi }}*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learning-hub-android-delta-${{ matrix.abi }}
          path: dist/delta
          if-no-files-found: ignore
