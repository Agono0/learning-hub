name: Nightly OTA

# Nightly delta-OTA release pipeline (Epic O1-08).
#
# Every night (or on demand): build the web export, the Windows installer AND
# the per-ABI Android APKs, hash the `.next-tauri` export into a signed
# content-addressed manifest via scripts/update-manifest.mjs (O1-07), diff it
# against the previous nightly to emit hot-update patch bundles, then tag
# `nightly-YYYYMMDD-<sha>` and publish everything (manifest + pointer + patches
# + installer + APKs + latest.json) as a GitHub prerelease.
#
# Jobs:
#   meta    — compute the version/tag, the monotonic shell version, and whether
#             the native shell changed since the previous nightly.
#   android — per-ABI APK matrix (keystore-guarded), uploaded as artifacts.
#   nightly — web export + Windows installer, consumes the APK artifacts,
#             generates the manifest (with androidPackages + fullPackageSize),
#             signs, and publishes the release + channel pointers + latest.json.
#
# A night whose web export is byte-identical to the previous release AND whose
# native shell did not change publishes NOTHING (the pointer stays put) — clients
# are never offered an empty update. This is what makes a docs-only change cost
# zero bytes (docs/updates.md §"Measured hot patch size").
#
# Channels: this workflow always publishes `nightly`. Promotion to beta/stable
# re-points those channels at an existing release (O1-11) — artifacts are never
# rebuilt for promotion.
#
# Signing keys: TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# repo secrets (O1-09 key ceremony). When absent the workflow publishes UNSIGNED
# with a loud warning — the client refuses unsigned manifests by design.

on:
  schedule:
    # 02:30 UTC daily — after the day's merges have settled, before EU morning.
    # NOTE: GitHub-hosted cron fires late under load (recent runs started 8–10h
    # after the schedule). The workflow_run trigger below is the timely path;
    # the cron is only the backstop for days with no merges.
    - cron: '30 2 * * *'
  # Release on push to main: every green CI run on main publishes a release
  # through this same pipeline (manifest + patches + installer + APKs +
  # pointer move) instead of waiting for the nightly cron. A red or cancelled
  # CI publishes nothing (guarded in the meta job's `if`).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and list artifacts but do NOT create the tag/release'
        type: boolean
        default: false
      measure_patch:
        description: 'O1-20 patch-size probe: build twice (one-line change) and report hot patch KB instead of releasing'
        type: boolean
        default: false

# Least privilege: read-only by default; only the publishing job writes releases.
permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  # onnxruntime-node (via @huggingface/transformers) has a postinstall that
  # downloads the CUDA provider libs from the NuGet feed on linux/x64. That
  # download times out from current runners and the app only ever uses the
  # bundled CPU runtime, so skip it everywhere we npm ci.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  meta:
    name: Compute nightly metadata
    runs-on: ubuntu-latest
    # workflow_run: publish only when the triggering CI run succeeded AS A
    # PUSH ON THIS REPOSITORY. A fork's completed CI run (or a PR-triggered
    # one) must never arm the privileged signing/publish jobs downstream —
    # the meta job's skip cascades through every `needs.meta.result` guard.
    if: ${{ !inputs.measure_patch && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      shell_version: ${{ steps.meta.outputs.shell_version }}
      native_version: ${{ steps.meta.outputs.native_version }}
      requires_native: ${{ steps.meta.outputs.requires_native }}
      prev_tag: ${{ steps.meta.outputs.prev_tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so we can diff native inputs against the previous tag.
          fetch-depth: 0
          # workflow_run: build the exact commit CI just proved green, not
          # whatever happens to sit at the default-branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute version, tag, shell version and native-change flag
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHORT_SHA="${HEAD_SHA::7}"
          NIGHT_DATE="$(date -u +%Y%m%d)"
          VERSION="${NIGHT_DATE}-${SHORT_SHA}"
          TAG="nightly-${VERSION}"
          # Native-shell version: 0.1.<UTC date * 100 + run_number % 100>.
          # Semver-numeric patch; Android versionCode-safe under Tauri's
          # derivation (major*1e6 + minor*1e3 + patch <= ~99.2M, far below the
          # 2.1e9 cap). The date dominates so versions increase across days;
          # the run number breaks same-day ties — two same-day builds used to
          # share a version, so the second was never offered via the
          # latest.json compare and Android saw an equal-version reinstall.
          # Date-based so this pipeline and native.yml's `latest` APKs share
          # one scale. Wraps only past 100 runs of one workflow per UTC day.
          SHELL_VERSION="0.1.$(( $(date -u +%y%m%d) * 100 + (${GITHUB_RUN_NUMBER:-0} % 100) ))"

          REQUIRES_NATIVE=false
          # Manual dispatch from a branch that is not main (or a version tag)
          # must never create the nightly release or move channel pointers —
          # dry_run=false there means "build for inspection only". Scheduled
          # and workflow_run runs always target main, so they may publish.
          PUBLISH=true
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${REF_NAME}" in
              main|v*) ;;
              *) PUBLISH=false ;;
            esac
          fi
          PREV_TAG="$(gh release list --limit 30 --json tagName --jq '[.[].tagName | select(startswith("nightly-"))][0] // ""')"
          if [ -n "$PREV_TAG" ]; then
            # Everything that can change the built shell — mirrors native.yml's
            # push path filter. The old list (apps/native + packages/db only)
            # missed the Tauri build scripts and dependency manifests, so a
            # build-script change produced a nightly with no rebuilt APKs.
            if [ -n "$(git diff --name-only "${PREV_TAG}" HEAD -- apps/native packages/db scripts/tauri-web.mjs scripts/tauri-android.mjs scripts/serve-static.mjs scripts/vendor-sqlite-wasm.mjs package.json package-lock.json .github/workflows/native.yml ':(exclude)**/*.md' 2>/dev/null)" ]; then
              REQUIRES_NATIVE=true
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "shell_version=${SHELL_VERSION}"
            echo "native_version=${SHELL_VERSION}"
            echo "requires_native=${REQUIRES_NATIVE}"
            echo "prev_tag=${PREV_TAG}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly ${VERSION} (tag ${TAG}), shell ${SHELL_VERSION}, prev=${PREV_TAG:-none}, requiresNative=${REQUIRES_NATIVE}, publish=${PUBLISH}"

  web-export:
    name: Web export
    needs: meta
    runs-on: ubuntu-latest
    # Explicit meta-success gate: a custom `if` replaces the implicit needs
    # success check, so without this a skipped meta (e.g. workflow_run from a
    # failed CI) would let this job run with empty metadata.
    if: ${{ !inputs.measure_patch && needs.meta.result == 'success' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run: build the exact commit CI just proved green, not the
          # default-branch tip (github.sha on workflow_run is the workflow-file
          # commit, not the triggering head).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/web/.next/cache
            apps/web/.next-tauri/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Bake monotonic shell version
        shell: bash
        env:
          SHELL_VERSION: ${{ needs.meta.outputs.shell_version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "apps/native/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.SHELL_VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("shell version →", c.version);
          '

      - name: Build web bundle for Tauri
        env:
          LH_APP_VERSION: ${{ needs.meta.outputs.version }}
        run: npm run web:tauri

      - name: Upload web export artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-web-export
          path: apps/web/.next-tauri
          include-hidden-files: true
          if-no-files-found: error

  android:
    name: Android APK (${{ matrix.abi }})
    needs: [meta, web-export]
    if: ${{ !inputs.measure_patch && needs.meta.result == 'success' && needs.meta.outputs.requires_native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
            tauri-target: aarch64
          - abi: armeabi-v7a
            rust-target: armv7-linux-androideabi
            tauri-target: armv7
          - abi: x86_64
            rust-target: x86_64-linux-android
            tauri-target: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run: same pinned commit as meta and web-export — the APKs
          # must wrap the export built from the same SHA CI proved green.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require persisted Android keystore (O1-22)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Sideload updates require a stable signing key — see docs/updates.md §'Android signing — keystore persistence (O1-22)'."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            apps/native/src-tauri/gen/android/**/*.gradle*
            apps/native/src-tauri/gen/android/**/gradle-wrapper.properties

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/native/src-tauri
          key: android-${{ matrix.abi }}

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download web export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tauri-web-export
          path: apps/web/.next-tauri

      - name: Bake monotonic shell version
        shell: bash
        env:
          SHELL_VERSION: ${{ needs.meta.outputs.shell_version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "apps/native/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.SHELL_VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("shell version →", c.version);
          '

      - name: Build APK (${{ matrix.abi }})
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          LH_UPDATE_CHANNEL_FLAVOR: sideload
          LH_APP_VERSION: ${{ needs.meta.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LH_SKIP_WEB_BUILD: '1'
        run: npm run android:build -- --target ${{ matrix.tauri-target }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.abi }}
          path: apps/native/src-tauri/gen/android/app/build/outputs/apk/**/Learning-HUB-${{ matrix.abi }}.apk
          if-no-files-found: error

  nightly:
    name: Build, sign, publish nightly
    needs: [meta, web-export, android]
    permissions:
      contents: write
    if: |
      always() &&
      !cancelled() &&
      needs.meta.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !inputs.measure_patch
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # workflow_run: build the exact commit CI just proved green.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/native/src-tauri

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download web export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tauri-web-export
          path: apps/web/.next-tauri

      - name: Bake monotonic shell version
        shell: bash
        env:
          SHELL_VERSION: ${{ needs.meta.outputs.shell_version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "apps/native/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.SHELL_VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("shell version →", c.version);
          '

      - name: Build Windows installer
        shell: bash
        env:
          LH_APP_VERSION: ${{ needs.meta.outputs.version }}
          LH_SKIP_WEB_BUILD: '1'
        run: |
          npm run app:build

      - name: Resolve installer artifact name + size
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          RAW_INSTALLER="$(ls apps/native/src-tauri/target/release/bundle/nsis/*.exe | head -n 1)"
          INSTALLER_DIR="$(dirname "$RAW_INSTALLER")"
          RAW_NAME="$(basename "$RAW_INSTALLER")"
          # GitHub release asset uploads replace spaces with dots (e.g. Learning HUB -> Learning.HUB).
          # Rename the artifact on disk so the URL in latest.json / manifest.json matches exactly (no 404).
          CLEAN_NAME="${RAW_NAME// /.}"
          INSTALLER="${INSTALLER_DIR}/${CLEAN_NAME}"
          if [ "$RAW_INSTALLER" != "$INSTALLER" ]; then
            mv "$RAW_INSTALLER" "$INSTALLER"
            if [ -f "${RAW_INSTALLER}.sig" ]; then
              mv "${RAW_INSTALLER}.sig" "${INSTALLER}.sig"
            fi
          fi
          echo "name=$CLEAN_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "size=$(wc -c < "$INSTALLER")" >> "$GITHUB_OUTPUT"

      - name: Download previous manifests (up to 5 recent releases)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/prev
          TAGS=$(gh release list --limit 20 --json tagName --jq '[.[].tagName | select(startswith("nightly-"))][0:5] | .[]')
          i=0
          for tag in $TAGS; do
            echo "downloading manifest for $tag..."
            if gh release download "$tag" --pattern 'manifest.json' --output "dist/prev/manifest-${i}.json" 2>/dev/null; then
              i=$((i + 1))
            fi
          done
          echo "Downloaded $i previous manifest(s)"

      - name: Download Android APK artifacts (if native updated)
        if: ${{ needs.meta.outputs.requires_native == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apk-*
          path: dist/android
          merge-multiple: true

      - name: Build Android packages map (if native updated)
        if: ${{ needs.meta.outputs.requires_native == 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/nightly
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const path = require("node:path");
            const dir = "dist/android";
            if (!fs.existsSync(dir)) process.exit(0);
            const repo = process.env.GITHUB_REPOSITORY;
            const tag = process.env.TAG;
            const packages = {};
            for (const f of fs.readdirSync(dir)) {
              const m = f.match(/^Learning-HUB-(.+)\.apk$/);
              if (!m) continue;
              const abi = m[1];
              const platform = abi === "universal" ? "android-universal" : "android-" + abi;
              const bytes = fs.readFileSync(path.join(dir, f));
              packages[platform] = {
                url: `https://github.com/${repo}/releases/download/${tag}/${f}`,
                sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
                size: bytes.length,
              };
            }
            fs.writeFileSync("dist/nightly/android-packages.json", JSON.stringify(packages, null, 2));
            console.log("android packages:", Object.keys(packages).join(", ") || "(none)");
          '

      - name: Generate manifest + patch bundles (diff vs previous releases)
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
          NATIVE_VERSION: ${{ needs.meta.outputs.native_version }}
          REQUIRES_NATIVE: ${{ needs.meta.outputs.requires_native }}
          INSTALLER_SIZE: ${{ steps.installer.outputs.size }}
        run: |
          set -euo pipefail
          mkdir -p dist/nightly
          FULL_URL="https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}/${{ steps.installer.outputs.name }}"
          ARGS=(
            --dir apps/web/.next-tauri
            --out dist/nightly/manifest.json
            --channel nightly
            --version "$VERSION"
            --build-sha "$SHORT_SHA"
            --min-native-version "$NATIVE_VERSION"
            --requires-native="$REQUIRES_NATIVE"
            --full-package-url "$FULL_URL"
            --full-package-size "$INSTALLER_SIZE"
          )
          if [ -f dist/nightly/android-packages.json ]; then
            ARGS+=(--android-packages dist/nightly/android-packages.json)
          fi
          for p in dist/prev/manifest-*.json; do
            if [ -f "$p" ]; then
              ARGS+=(--prev "$p")
            fi
          done
          node scripts/update-manifest.mjs "${ARGS[@]}"

      - name: Detect unchanged build (skip empty releases)
        id: detect
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const cur = JSON.parse(fs.readFileSync("dist/nightly/manifest.json", "utf8"));
            let skip = false;
            if (fs.existsSync("dist/prev/manifest-0.json") && !cur.requiresNative) {
              const prev = JSON.parse(fs.readFileSync("dist/prev/manifest-0.json", "utf8"));
              const key = (f) => f.path + "|" + f.sha256 + "|" + f.size;
              const a = cur.files.map(key).sort().join("\n");
              const b = prev.files.map(key).sort().join("\n");
              skip = a === b;
            }
            console.log(skip ? "UNCHANGED build — skipping release (no client update)" : "changed build — publishing");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          '

      - name: Emit nightly pointer + Windows latest.json
        if: ${{ steps.detect.outputs.skip != 'true' }}
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHELL_VERSION: ${{ needs.meta.outputs.shell_version }}
          TAG: ${{ needs.meta.outputs.tag }}
          INSTALLER_NAME: ${{ steps.installer.outputs.name }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("dist/nightly/manifest.json", "utf8"));
            const repo = process.env.GITHUB_REPOSITORY;
            const tag = process.env.TAG;
            const base = `https://github.com/${repo}/releases/download/${tag}`;
            const pointer = {
              channel: "nightly",
              version: manifest.version,
              manifestUrl: `${base}/manifest.json`,
              publishedAt: new Date().toISOString(),
              notes: "Nightly " + manifest.version + " — " + manifest.files.length + " files, " + manifest.patches.length + " patch path(s)",
            };
            fs.writeFileSync("dist/nightly/nightly.json", JSON.stringify(pointer, null, 2) + "\n");
            // Official Tauri-updater document for the Windows shell (O1-10).
            // The NSIS artifact signature (.exe.sig) is the base64 minisign text
            // the plugin verifies against the committed pubkey.
            const sigPath = process.env.INSTALLER_PATH + ".sig";
            const signature = fs.existsSync(sigPath) ? fs.readFileSync(sigPath, "utf8").trim() : "";
            if (!signature) console.log("::warning::no installer .sig found — latest.json will carry an empty signature");
            const latest = {
              version: process.env.SHELL_VERSION,
              notes: pointer.notes,
              pub_date: pointer.publishedAt,
              platforms: {
                "windows-x86_64": { url: `${base}/${process.env.INSTALLER_NAME}`, signature },
              },
            };
            fs.writeFileSync("dist/nightly/latest.json", JSON.stringify(latest, null, 2) + "\n");
          '

      - name: Sign manifest and pointer (minisign via Tauri CLI)
        if: ${{ steps.detect.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set — publishing UNSIGNED artifacts (client will refuse them; configure the O1-09 keys before a real nightly)."
            exit 0
          fi
          PASS_ARGS=(-p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}")
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "${PASS_ARGS[@]}" dist/nightly/manifest.json
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "${PASS_ARGS[@]}" dist/nightly/nightly.json

      - name: Dry-run artifact list
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "Dry run — artifacts that WOULD be published to release ${{ needs.meta.outputs.tag }}:"
          ls -l dist/nightly
          echo "--- manifest head ---"
          head -c 2000 dist/nightly/manifest.json

      - name: Create tag + prerelease with assets
        if: ${{ !inputs.dry_run && steps.detect.outputs.skip != 'true' && needs.meta.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          TARGET="${{ github.event.workflow_run.head_sha || github.sha }}"
          ASSETS=(dist/nightly/manifest.json dist/nightly/nightly.json dist/nightly/latest.json)
          for f in dist/nightly/*.sig dist/nightly/patch-*.zip; do
            if [ -e "$f" ]; then ASSETS+=("$f"); fi
          done
          ASSETS+=("${{ steps.installer.outputs.path }}")
          if [ -e "${{ steps.installer.outputs.path }}.sig" ]; then
            ASSETS+=("${{ steps.installer.outputs.path }}.sig")
          fi
          if [ -d dist/android ]; then
            for f in dist/android/*.apk; do
              if [ -e "$f" ]; then ASSETS+=("$f"); fi
            done
          fi
          # Idempotent: a same-day rerun on the same commit (schedule after a
          # dispatch, or a retried failed run) must not die on "tag already
          # exists" — reuse the release and replace the assets instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading assets with --clobber"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --target "$TARGET" \
              --title "Nightly ${{ needs.meta.outputs.version }}" \
              --notes "Automated nightly build ${{ needs.meta.outputs.version }} (commit $TARGET). Fast delta OTA updates + Windows installer." \
              --prerelease \
              "${ASSETS[@]}"
          fi

      # O1-11 pointer hosting: ONE stable URL per channel on the fixed
      # `channel-pointers` release (the nightly tag changes every night).
      - name: Publish nightly pointer + latest.json to channel-pointers
        if: ${{ !inputs.dry_run && steps.detect.outputs.skip != 'true' && needs.meta.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view channel-pointers >/dev/null 2>&1; then
            gh release create channel-pointers \
              --title "Update channel pointers" \
              --notes "Mutable pointer assets (nightly.json / beta.json / stable.json / latest.json) and per-channel signed manifests. This is the stable URL set clients poll. Never delete this release." \
              --latest=false
          fi
          cp dist/nightly/manifest.json dist/nightly/manifest-nightly.json
          if [ -e dist/nightly/manifest.json.sig ]; then
            cp dist/nightly/manifest.json.sig dist/nightly/manifest-nightly.json.sig
          fi
          ASSETS=(dist/nightly/nightly.json dist/nightly/manifest-nightly.json)
          # latest.json moves the OFFICIAL Windows updater (NSIS reinstall).
          # Only republish it when the native shell actually changed — a
          # web-only nightly must ride the A/B slot hot update, not prompt a
          # full installer download every night.
          if [ "${{ needs.meta.outputs.requires_native }}" = "true" ]; then
            ASSETS+=(dist/nightly/latest.json)
          else
            echo "requires_native=false — leaving channel-pointers latest.json untouched (web-only hot update)"
          fi
          for f in dist/nightly/nightly.json.sig dist/nightly/manifest-nightly.json.sig; do
            if [ -e "$f" ]; then ASSETS+=("$f"); fi
          done
          for f in "${ASSETS[@]}"; do
            gh release delete-asset channel-pointers "$(basename "$f")" -y || true
            gh release upload channel-pointers "$f"
          done

      - name: Upload workflow artifact (always, for inspection)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ needs.meta.outputs.version }}
          path: |
            dist/nightly
            dist/android
          if-no-files-found: error

  # O1-20 patch-size probe (manual dispatch only, `measure_patch=true`):
  # builds the export twice — baseline, then a ONE-LINE change — and measures
  # the hot patch a nightly would actually ship for that change. With the
  # deterministic build ID (next.config.ts) a zero-code change now hashes
  # identically, so the probe makes a REAL one-line edit (a body attribute on
  # the root layout — the worst case, since every page embeds the layout).
  measure-patch:
    name: Measure hot patch size (one-line change)
    runs-on: ubuntu-latest
    if: ${{ inputs.measure_patch }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/web/.next/cache
            apps/web/.next-tauri/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build baseline export
        run: npm run web:tauri

      - name: Snapshot baseline manifest
        run: >-
          node scripts/update-manifest.mjs
          --dir apps/web/.next-tauri
          --out dist/measure/base-manifest.json
          --channel nightly --version 00000000-base --build-sha 0000000000
          --min-native-version 0.0.0
          --full-package-url https://example.invalid/patch-probe

      - name: Apply a one-line web change
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const p = "apps/web/app/layout.tsx";
            const s = fs.readFileSync(p, "utf8");
            if (!s.includes("<body")) throw new Error("layout has no <body> to probe");
            fs.writeFileSync(p, s.replace("<body", `<body data-ota-probe="${Date.now()}"`));
          '

      - name: Rebuild export with the change
        run: npm run web:tauri

      - name: Generate patch vs baseline and report size
        run: >-
          node scripts/update-manifest.mjs
          --dir apps/web/.next-tauri
          --out dist/measure/probe-manifest.json
          --channel nightly --version 00000000-probe --build-sha 0000000001
          --min-native-version 0.0.0
          --full-package-url https://example.invalid/patch-probe
          --prev dist/measure/base-manifest.json

      - name: Report measured patch size
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");
            const manifest = JSON.parse(fs.readFileSync("dist/measure/probe-manifest.json", "utf8"));
            const patch = manifest.patches[0];
            if (!patch) throw new Error("probe produced no patch — the one-line change changed no export files");
            const kb = patch.size / 1024;
            const listing = execSync("unzip -l dist/measure/patch-00000000-base-00000000-probe.zip", { encoding: "utf8" });
            const count = listing.match(/^\s*(\d+)\s+files\s*$/m);
            const files = count ? Number(count[1]) : 0;
            const line = kb <= 50
              ? `PASS: hot patch for a one-line change = ${kb.toFixed(1)} KB (< 50 KB target)`
              : `DEVIATION: hot patch = ${kb.toFixed(1)} KB exceeds the 50 KB target — investigate (see docs/updates.md)`;
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## O1-20 hot patch size\n\n${line} (${files} files in bundle)\n`);
          '
