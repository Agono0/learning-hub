name = "learning-hub-engagement"
main = "src/index.ts"
compatibility_date = "2026-11-23"
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true

# The following bindings are for community library & live study rooms.
# Commented out for crash-reporter-only mode.
#
# # D1 Database Binding
# [[d1_databases]]
# binding = "DB"
# database_name = "learning-hub-d1"
# database_id = "local-d1-hub"
# migrations_dir = "migrations"
#
# # Durable Objects Bindings
# [durable_objects]
# bindings = [
#   { name = "STUDY_ROOM", class_name = "StudyRoom" },
#   { name = "BOSS_RAID", class_name = "BossRaid" },
#   { name = "LEAGUE_ROOM", class_name = "LeagueRoom" }
# ]
#
# [[migrations]]
# tag = "v1"
# new_classes = ["StudyRoom", "BossRaid"]
#
# Authenticated leagues are inactive groundwork. Enabling them needs the
# LEAGUE_ROOM binding above, a migration adding "LeagueRoom", and
# LEAGUES_ENABLED = "true". All three are the owner's call; none ships on.

