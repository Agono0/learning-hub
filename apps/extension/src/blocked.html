<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Max Focus — Site Blocked</title>
    <style>
      :root {
        --bg: #09090b;
        --card: #141417;
        --border: #27272a;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --primary: #6366f1;
        --primary-hover: #4f46e5;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background-color: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 36px 32px;
        max-width: 460px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        color: #a5b4fc;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 10px;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
        padding: 12px 20px;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .btn:hover {
        background: var(--primary-hover);
      }
      .footnote {
        margin-top: 18px;
        font-size: 12px;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">🛡️ Max Focus Active</div>
      <h1>Stay with your flow</h1>
      <p>
        This destination is shielded to protect your working memory and deep focus. You can return
        to Learning HUB or your allowed learning resources.
      </p>
      <a href="http://localhost:3000/focus" class="btn">Return to Learning HUB</a>
      <div class="footnote">Precommitment protects your future self. Take a deep breath.</div>
    </div>
  </body>
</html>
